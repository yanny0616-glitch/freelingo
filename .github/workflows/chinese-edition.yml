name: Chinese edition images

on:
  push:
    branches: [main, feat/zh-cn-interface]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: chinese-edition-${{ github.ref }}
  cancel-in-progress: true

jobs:
  images:
    if: github.repository_owner == 'yanny0616-glitch'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, validate and publish
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service == 'backend' && './backend' || '.' }}
          file: ${{ matrix.service }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/freelingo-${{ matrix.service }}:zh-${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/freelingo-${{ matrix.service }}:zh-latest
          cache-from: type=gha,scope=zh-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=zh-${{ matrix.service }}
      - name: Verify backend accepts Chinese interface preference
        if: matrix.service == 'backend'
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/freelingo-backend@${{ steps.build.outputs.digest }}
        run: |
          docker run --rm --entrypoint python "$IMAGE" -c 'from app.schemas.auth import UserUpdateRequest; assert UserUpdateRequest(ui_locale="zh").ui_locale == "zh"'
